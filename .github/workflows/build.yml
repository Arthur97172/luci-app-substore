name: Build Package

permissions:
  contents: write

on:
  push:
    branches: [main]
  workflow_dispatch:

# 同一时间只串行执行一个构建，避免并发时 tag 冲突
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------- 并行编译：ipk（24.10）与 apk（25.12）各占一个 runner ----------
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false   # 一条腿失败不取消另一条，保证另一份产物仍能产出
      matrix:
        include:
          - artifact: ipk
            sdk_url: https://downloads.openwrt.org/releases/24.10.8/targets/x86/64/openwrt-sdk-24.10.8-x86-64_gcc-13.3.0_musl.Linux-x86_64.tar.zst
            pkg_ext: ipk
          - artifact: apk
            sdk_url: https://downloads.openwrt.org/releases/25.12.5/targets/x86/64/openwrt-sdk-25.12.5-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst
            pkg_ext: apk

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          path: package-dir

      # 说明：本包 Makefile 为 PKGARCH:=all（纯 Lua + shell，无编译产物），
      # 编译结果固定为 luci-app-substore_<版本>_all.ipk/.apk，架构字段为 all，
      # 一份产物即可安装到 ARM / x86 / MIPS 等所有平台，无需按架构分别编译，
      # 因此任意一个 target 的 SDK（此处用 x86/64）即可编译出通用包。
      - name: Download SDK
        run: |
          curl -sL --retry 5 --retry-delay 10 "${{ matrix.sdk_url }}" -o sdk.tar.zst

      - name: Extract SDK
        run: |
          tar -xf sdk.tar.zst && mv openwrt-sdk-* sdk

      - name: Copy package to SDK
        run: |
          mkdir -p sdk/package/luci-app-substore
          cp -r package-dir/* sdk/package/luci-app-substore/

      - name: Install feeds
        run: |
          cd sdk
          # 必须保留 base feed：它提供 liblua/libucode/libnl-tiny/libubox 等 LuCI 编译依赖。
          # 把 full 克隆（24.10 的 base）转浅克隆加速；其余 feed 已是浅克隆。
          sed -e 's/^src-git-full /src-git /' feeds.conf.default > feeds.conf
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          # 打开简体中文语言符号，否则 luci-i18n-substore-zh-cn 不会被编译出来。
          # 该翻译包是 HIDDEN 包（feeds/luci/luci.mk 的 LuciTranslation 里 HIDDEN:=1），
          # HIDDEN 包在 Kconfig 里没有 prompt（scripts/package-metadata.pl），
          # 于是 luci.mk 给它的唯一默认值 LUCI_LANG_zh_Hans||(ALL&&m) 成为唯一入口；
          # SDK 默认配置里 ALL=n，所以必须显式打开这个符号。
          # 注意 CONFIG_PACKAGE_luci-i18n-substore-zh-cn=m 对无 prompt 的符号是空操作
          # （Kconfig 只对 visible 的符号采用用户值），真正生效的是下面这行。
          # 必须在 make defconfig 之前写入：defconfig 会保留这个已可见符号的用户值。
          echo "CONFIG_LUCI_LANG_zh_Hans=y" >> .config
          make defconfig

      - name: Build package
        run: |
          cd sdk
          # i18n 子包与该目录同属一个 builddir，会一并编译。
          # 注意不存在 package/luci-i18n-substore-zh-cn/compile 这个目标。
          make -j"$(nproc)" package/luci-app-substore/compile V=s

      - name: Collect artifact
        run: |
          mkdir -p artifacts
          find sdk/bin/packages -type f -name "luci-*substore*.${{ matrix.pkg_ext }}" -exec cp {} artifacts/ \;
          # 不能用 test -s artifacts/*：多个产物时 glob 展开成多参数，test 会报 binary operator expected
          [ -n "$(ls -A artifacts 2>/dev/null)" ] || { echo "No artifact found!"; exit 1; }
          # 翻译包缺失说明 i18n 子包没被编译出来，直接失败以便尽早发现
          ls artifacts/ | grep -q "luci-i18n-substore" || { echo "i18n package missing!"; exit 1; }
          ls -lh artifacts/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/
          if-no-files-found: ignore   # 编译失败时无产物不报错，由 release 阶段兜底

  # ---------- 两个编译都完成后，合并产物并统一发布 Release ----------
  release:
    needs: build
    if: ${{ !cancelled() }}   # 任一编译失败也仍尝试发布成功的那份（全失败则由校验拦截）
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Read version from Makefile
        id: version
        run: |
          VER=$(sed -n 's/^PKG_VERSION:=//p' Makefile | tr -d '[:space:]')
          REL=$(sed -n 's/^PKG_RELEASE:=//p' Makefile | tr -d '[:space:]')
          PKGVER="${VER}-r${REL}"
          echo "PKGVER=${PKGVER}" >> "$GITHUB_OUTPUT"
          echo "包版本：${PKGVER}"

      - name: Download ipk artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ipk
          path: artifacts

      - name: Download apk artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: apk
          path: artifacts

      - name: Verify artifacts
        run: |
          if ! ls artifacts/* 1>/dev/null 2>&1; then
            echo "没有编译产物，终止构建"
            exit 1
          fi
          ls -lh artifacts/

      # 删除同名旧 tag / Release（幂等），避免重跑时 tag 已存在
      - name: Delete existing release/tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PKGVER="${{ steps.version.outputs.PKGVER }}"
          gh release delete "$PKGVER" -y --cleanup-tag 2>/dev/null || true
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$PKGVER" 2>/dev/null || true

      # 发布 Release：tag / name 与 Makefile 版本一致
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.PKGVER }}
          name: ${{ steps.version.outputs.PKGVER }}
          body: |
            自动编译的插件包（版本 ${{ steps.version.outputs.PKGVER }}）

            - `.ipk`（opkg）— OpenWrt/ImmortalWrt 24.10 及更早
            - `.apk`（apk）— OpenWrt/ImmortalWrt 25.12+
            - 架构 `all`：纯 Lua 包，同一份产物同时支持 ARM / x86 / MIPS 等所有平台
            - `luci-i18n-substore-zh-cn`：简体中文翻译包（可选安装；不装则界面为英文）
          files: artifacts/*
          token: ${{ github.token }}
          make_latest: true
